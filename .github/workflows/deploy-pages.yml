name: Deploy to GitHub Pages

# Fires on a push to whichever branch the repository calls its default, rather
# than to a hard-coded name — this repository's default is not "main", and a
# branches: [main] filter would simply never fire.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Read and parse rather than require(): Node's CommonJS loader only knows
      # .js, .json and .node, so require() treats a .webmanifest as JavaScript
      # and dies on the first key.
      - name: Check the published files parse
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const read = (path) => JSON.parse(readFileSync(path, 'utf8'));

            const data = read('./data/events.json');
            if (!Array.isArray(data.events) || !data.events.length) {
              throw new Error('data/events.json has no events');
            }
            console.log(data.events.length + ' activities');

            const manifest = read('./manifest.webmanifest');
            if (!manifest.icons?.length || !manifest.start_url) {
              throw new Error('manifest.webmanifest is incomplete');
            }
            console.log(manifest.name + ' - ' + manifest.icons.length + ' icons');
          "

      # Every icon the manifest names must actually be in the artifact, or the
      # install prompt silently declines to appear.
      - name: Check the manifest's icons exist
        run: |
          node -e "
            const { readFileSync, existsSync } = require('node:fs');
            const manifest = JSON.parse(readFileSync('./manifest.webmanifest', 'utf8'));
            const missing = manifest.icons.map((i) => i.src).filter((src) => !existsSync(src));
            if (missing.length) throw new Error('missing icons: ' + missing.join(', '));
            console.log(manifest.icons.length + ' icons present');
          "

      # Stamp the service worker with this commit, so a deploy always lands in a
      # fresh cache and installed copies pick it up instead of serving the old
      # shell from disk.
      - name: Version the service worker
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" sw.js
          grep -n 'const VERSION' sw.js

      - uses: actions/configure-pages@v5

      # The site is plain HTML, CSS and ES modules — the repository root is the
      # artifact, no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
