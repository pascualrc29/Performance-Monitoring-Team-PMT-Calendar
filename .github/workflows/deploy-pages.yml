name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the calendar data parses
        run: node -e "const d=require('./data/events.json'); if(!Array.isArray(d.events)||!d.events.length) throw new Error('events.json has no events'); console.log(d.events.length+' activities')"

      - uses: actions/configure-pages@v5

      # The site is plain HTML, CSS and ES modules — the repository root is the
      # artifact, no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
