name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the calendar data parses
        run: node -e "const d=require('./data/events.json'); if(!Array.isArray(d.events)||!d.events.length) throw new Error('events.json has no events'); console.log(d.events.length+' activities')"

      - name: Check the web app manifest parses
        run: node -e "const m=require('./manifest.webmanifest'); if(!m.icons?.length||!m.start_url) throw new Error('manifest is incomplete'); console.log(m.name+' — '+m.icons.length+' icons')"

      # Stamp the service worker with this commit, so a deploy always lands in a
      # fresh cache and installed copies pick it up instead of serving the old
      # shell from disk.
      - name: Version the service worker
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" sw.js
          grep -n 'const VERSION' sw.js

      - uses: actions/configure-pages@v5

      # The site is plain HTML, CSS and ES modules — the repository root is the
      # artifact, no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
