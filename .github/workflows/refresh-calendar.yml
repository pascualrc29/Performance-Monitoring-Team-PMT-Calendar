name: Refresh calendar data

# The site ships a snapshot of the PMT Google Calendar because Google's
# iCalendar endpoint sends no CORS headers, so the browser cannot read it
# directly. This job re-reads the feed and commits the snapshot when it changes.

on:
  schedule:
    # 06:00 and 18:00 Philippine time (UTC+8).
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Read the calendar feed
        run: node scripts/build-data.mjs

      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- data/; then
            echo "Calendar unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): refresh PMT calendar snapshot"
          git push
