name: Refresh calendar data

# The site ships a snapshot of the PMT Google Calendar because Google's
# iCalendar endpoint sends no CORS headers, so the browser cannot read it
# directly. This job re-reads the feed, commits the snapshot when the schedule
# actually changed, and publishes it.
#
# It publishes in a second job rather than leaving that to deploy-pages.yml,
# because GitHub does not start a workflow from a push made with the default
# GITHUB_TOKEN:
#   "When you use the repository's GITHUB_TOKEN to perform tasks, events
#    triggered by the GITHUB_TOKEN will not create a new workflow run."
# Without this, every refresh landed in the repository and none of them ever
# reached the live site.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The feed is read inside the loop rather than in a step of its own: a
      # rejected push means the checkout was stale, so the snapshot has to be
      # rebuilt on top of whatever the branch actually holds now, not replayed
      # onto the commit the runner happened to start from.
      - name: Commit the snapshot if the schedule changed
        id: commit
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Retry because another refresh may push between fetch and push.
          for attempt in 1 2 3; do
            # Explicit refspec: the shallow checkout only configures a fetch
            # refspec for this branch, and a bare `git fetch origin "$BRANCH"`
            # is not guaranteed to move origin/$BRANCH — if it did not, the
            # reset below would fail the job instead of retrying.
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

            # Keep the local checkout current before generating/committing data.
            git reset --hard "origin/$BRANCH"

            node scripts/build-data.mjs

            if git diff --quiet -- data/; then
              echo "Calendar unchanged; nothing to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): refresh PMT calendar snapshot"

            if git push origin "HEAD:$BRANCH"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected on attempt $attempt; retrying with the latest remote branch."
            git reset --hard "origin/$BRANCH"
          done

          echo "Unable to push after 3 attempts."
          exit 1

  # Publishes the commit the refresh just made. Mirrors deploy-pages.yml; the
  # two are kept in step deliberately rather than shared, because a reusable
  # workflow would check out the caller's SHA, which predates that commit.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.refresh.outputs.sha }}

      - name: Check the published files parse
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const data = JSON.parse(readFileSync('./data/events.json', 'utf8'));
            if (!Array.isArray(data.events) || !data.events.length) {
              throw new Error('data/events.json has no events');
            }
            console.log(data.events.length + ' activities');
          "

      - name: Version the service worker
        env:
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          sed -i "s/__BUILD__/${SHA:0:12}/" sw.js
          grep -n 'const VERSION' sw.js

      - uses: actions/configure-pages@v6

      # upload-pages-artifact v4 started excluding dotfiles from the tarball.
      # v3 shipped them, and .nojekyll is one, so keep the artifact byte-for-byte
      # what it was rather than quietly dropping files the site already ships.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
